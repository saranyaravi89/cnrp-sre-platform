replicaCount: 2

image:
  repository: 985411011517.dkr.ecr.ap-southeast-1.amazonaws.com/cnrp-trading-api
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

container:
  port: 8000

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  logDir: /app/app/logs

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  cpuUtilization: 60

ingress:
  enabled: false